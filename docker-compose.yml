services:
  db:
    build: ./db
    container_name: postgres-db
    env_file: .env
    volumes:
      - datos_db:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./api
    container_name: php-api
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:

volumes:
  datos_db:
