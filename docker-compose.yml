services:
  db:
    build: ./db
    image: postgres:1.0
    container_name: postgres-db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 5
    restart: unless-stopped

volumes:
  datos_db: