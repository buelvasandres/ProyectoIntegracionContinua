name: CI Docker Build Check
on:
 push:
   branches:
     - main
 pull_request:
   branches:
     - main
jobs:
 build-and-test:
   runs-on: ubuntu-latest
   steps:
     - name: Descargar el código del repositorio
       uses: actions/checkout@v3
     - name: Validar sintaxis de Docker Compose
       run: docker-compose config
     - name: Probar construcción de los contenedores
       # Esto asegura que los Dockerfiles compilan sin errores
       run: docker-compose build
